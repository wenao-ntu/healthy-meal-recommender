# Shared ranking protocol for every preference model.
seed: 2026
reproducibility: true
repeatable: false
worker: 0
show_progress: false
save_dataset: false
save_dataloaders: false
log_wandb: false

metrics: [Recall, NDCG]
topk: [5, 10, 20]
valid_metric: NDCG@10
metric_decimal_place: 6
eval_batch_size: 262144
eval_args:
  split: {RS: [0.8, 0.1, 0.1]}
  order: RO
  group_by: user
  mode: full
